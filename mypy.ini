# mypy configuration (run: python -m mypy)
# Scoped to app/ — tests are mock-heavy by design and checked only by pytest.
[mypy]
python_version = 3.13
files = app
plugins = pydantic.mypy
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Heavy / optional deps intentionally NOT installed in the dev venv (BRAIN.md
# D3/D4) or lacking stubs — treat their imports as Any instead of erroring.
[mypy-chromadb]
ignore_missing_imports = True

[mypy-sentence_transformers]
ignore_missing_imports = True

[mypy-litellm]
ignore_missing_imports = True

[mypy-celery]
ignore_missing_imports = True

[mypy-celery.exceptions]
ignore_missing_imports = True

[mypy-jose]
ignore_missing_imports = True

# Observability SDKs. OpenTelemetry ships in requirements.txt (the Docker image)
# and prometheus-client arrives transitively with prometheus-fastapi-
# instrumentator; neither is installed in the dev venv, and both are imported
# lazily inside functions (Phase 4, Steps 4.1-4.2).
[mypy-opentelemetry.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True
