[pytest]
# Async test support via pytest-asyncio in auto mode: any `async def test_*`
# is collected and run without needing an explicit @pytest.mark.asyncio.
asyncio_mode = auto

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    integration: end-to-end tests exercising multiple components
    requires_chromadb: test needs a real chromadb install (skipped otherwise)
    requires_litellm: test needs a real litellm install (skipped otherwise)
    slow: long-running test
